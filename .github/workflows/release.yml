# Builds the Windows installer on every pull request and manual run (artifact only).
# A pushed `v*` tag also publishes that build as the tag's GitHub Release, asset `Waqt-setup.exe`,
# so https://github.com/seifsg/waqt/releases/latest/download/Waqt-setup.exe always works.
name: release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "::error::tag $GITHUB_REF_NAME != v$version in tauri.conf.json"; exit 1; }
      - run: npm ci
      - name: Lockfile is current
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run typecheck
      - run: npm test
      - run: npx tauri build
      - name: Name the installer
        shell: bash
        run: |
          cp src-tauri/target/release/bundle/nsis/*-setup.exe Waqt-setup.exe
          sha256sum Waqt-setup.exe > Waqt-setup.exe.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Waqt-setup
          path: |
            Waqt-setup.exe
            Waqt-setup.exe.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Waqt-setup
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Waqt-setup.exe Waqt-setup.exe.sha256 --repo "$GITHUB_REPOSITORY" --title "Waqt $GITHUB_REF_NAME" --generate-notes
